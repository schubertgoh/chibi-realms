# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: chibi-realms
    runtime: node
    plan: free
    # Deploys are triggered by .github/workflows/deploy.yml, not by Render watching the repo.
    autoDeploy: false
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/leaderboard
    envVars:
      - key: NODE_VERSION
        value: "24"
      # AI companion brain. Set the value in the Render dashboard (Environment tab); .env is not deployed.
      - key: OPENCODE_API_KEY
        sync: false
      # Free instances have no persistent disk, so accounts reset when the service restarts or redeploys.
      # To keep data: switch to a paid plan, add a disk mounted at /var/data, and uncomment below.
      # - key: DATA_DIR
      #   value: /var/data
